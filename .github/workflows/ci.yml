name: CI Workflows (Backend & Frontend)

on:
  push:
    branches: ["main", "landing-page", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test-backend:
    name: Build & Verify Backend (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Build NestJS Application
        run: |
          cd backend
          npm run build

  test-frontend:
    name: Build & Verify Frontend (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build Next.js 16 Application
        run: |
          cd frontend
          pnpm run build