name: Continuous Deployment (AWS EC2 Coolify)

on:
  push:
    branches: ["main"]

jobs:
  deploy-backend:
    name: Deploy Backend to AWS EC2 via Coolify Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deployment Webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL secret is not set in GitHub repository secrets."
            exit 1
          fi
          echo "Triggering Coolify deployment for supersparton/CareerAtlas:main on AWS EC2..."
          
          # Pass Bearer authorization token header if COOLIFY_TOKEN secret exists
          AUTH_HEADER=""
          if [ -n "$COOLIFY_TOKEN" ]; then
            AUTH_HEADER="-H \"Authorization: Bearer $COOLIFY_TOKEN\""
          fi
          
          # Call Coolify Webhook URL with GET/POST and capture response status code
          RESPONSE=$(curl -k -s -w "\nHTTP_STATUS:%{http_code}" $AUTH_HEADER -X GET "$COOLIFY_WEBHOOK_URL" || curl -k -s -w "\nHTTP_STATUS:%{http_code}" $AUTH_HEADER -X POST "$COOLIFY_WEBHOOK_URL")
          
          echo "Coolify Server Response:"
          echo "$RESPONSE"
