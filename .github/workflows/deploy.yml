name: Continuous Deployment (AWS EC2 Coolify + Vercel)

on:
  push:
    branches: ["main"]

jobs:
  deploy-backend:
    name: Deploy Backend to AWS EC2 via Coolify Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deployment Webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL secret is not set in GitHub repository secrets."
            exit 1
          fi
          echo "Triggering Coolify deployment for supersparton/CareerAtlas:main on AWS EC2..."
          # Pass -k / --insecure to allow HTTP/HTTPS IP address webhooks without SSL SNI errors
          curl -k -fsSL -X POST "$COOLIFY_WEBHOOK_URL" || curl -k -fsSL -X GET "$COOLIFY_WEBHOOK_URL"
          echo "Coolify deployment webhook successfully triggered!"

  deploy-frontend:
    name: Deploy Frontend to Vercel CDN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Vercel CLI & Deploy Frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set in GitHub repository secrets."
            exit 1
          fi
          npm install -g vercel@latest
          cd frontend
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          echo "Frontend successfully deployed to Vercel Production!"
